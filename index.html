<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Permutation Generator</title>
</head>
<body>
<main>
 <h1>Permutation Generator</h1>   
 <p>Enter a word to generate all unique permutations.</p>
 <div class="input-container">
  <label for="input-text">Your word</label>  
   <input id="input-text" type="text" placeholder="Enter a word, e.g. cat">
  <div class="button-container">
   <button id="submit-btn" type="button">Generate</button>
   <button id="clear-btn" type="button">Clear</button>
  </div>
 </div>
 <div class="result-container" id="result" aria-live="polite">
  
 </div>
</main>    
 

 <script src="script.js"></script>  
</body>
</html>
